<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Life Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🏠 My Life Dashboard</h1>
        <p>Organize your day. Track your progress. Build your life.</p>
    </header>

    <main>

        <section class="dashboard">

            <div class="card">
                <h2>🎯 Goals</h2>
                <p>Learn Python</p>
                <p>Exercise regularly</p>
            </div>

            <div class="card">
                <h2>✅ Tasks</h2>
                <p>☐ Study for 1 hour</p>
                <p>☐ Read 20 pages</p>
            </div>

            <div class="card">
                <h2>📚 Study</h2>
                <p>Hours this week: <strong>12</strong></p>
            </div>

            <div class="card">
                <h2>💰 Expenses</h2>
                <p>This month: <strong>₹2,450</strong></p>
            </div>

        </section>

    </main>

    <footer>
        <p>Built with curiosity ☕ and code 💻</p>
    </footer>

</body>
</html>
